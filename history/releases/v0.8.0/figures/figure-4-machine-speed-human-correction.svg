<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Machine speed versus human correction</title>
  <desc id="desc">Two time lanes contrast repeated automated commitments with a slower human correction route. A staged brake before commitment preserves time for inspection and challenge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
    <style>
      .title{font:600 30px Arial,sans-serif;fill:#111827}.head{font:600 21px Arial,sans-serif;fill:#111827}.text{font:17px Arial,sans-serif;fill:#1f2937}.small{font:15px Arial,sans-serif;fill:#374151}.lane{stroke:#374151;stroke-width:4;marker-end:url(#arrow)}.machine{fill:#f3e5e3;stroke:#8b3f35;stroke-width:2}.human{fill:#e8edf3;stroke:#46586d;stroke-width:2}.brake{fill:#e6f2ea;stroke:#356b4b;stroke-width:3}.commit{stroke:#8b2e2e;stroke-width:3}.dash{stroke:#6b7280;stroke-width:3;stroke-dasharray:10 7}.connector{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Machine speed versus human correction</text>
  <text x="90" y="98" class="head">Automated selection</text>
  <line x1="300" y1="137" x2="1110" y2="137" class="lane"/>
  <rect x="330" y="105" width="90" height="64" rx="10" class="machine"/><text x="375" y="144" text-anchor="middle" class="text">commit</text>
  <rect x="455" y="105" width="90" height="64" rx="10" class="machine"/><text x="500" y="144" text-anchor="middle" class="text">commit</text>
  <rect x="580" y="105" width="90" height="64" rx="10" class="machine"/><text x="625" y="144" text-anchor="middle" class="text">commit</text>
  <rect x="705" y="105" width="90" height="64" rx="10" class="machine"/><text x="750" y="144" text-anchor="middle" class="text">commit</text>
  <text x="845" y="194" class="small">continues at system speed</text>
  <text x="90" y="253" class="head">Human correction route</text>
  <line x1="300" y1="292" x2="1110" y2="292" class="lane"/>
  <rect x="330" y="260" width="135" height="64" rx="10" class="human"/><text x="397" y="299" text-anchor="middle" class="text">notice harm</text>
  <rect x="525" y="260" width="135" height="64" rx="10" class="human"/><text x="592" y="299" text-anchor="middle" class="text">find route</text>
  <rect x="720" y="260" width="135" height="64" rx="10" class="human"/><text x="787" y="299" text-anchor="middle" class="text">reach authority</text>
  <rect x="915" y="260" width="135" height="64" rx="10" class="human"/><text x="982" y="299" text-anchor="middle" class="text">correct</text>
  <line x1="690" y1="82" x2="690" y2="350" class="commit"/>
  <text x="690" y="382" text-anchor="middle" class="small">commitment boundary may arrive before correction</text>
  <text x="90" y="423" class="head">Staged path with an independent brake</text>
  <line x1="300" y1="467" x2="1110" y2="467" class="lane"/>
  <rect x="350" y="425" width="190" height="84" rx="12" class="brake"/>
  <text x="445" y="458" text-anchor="middle" class="head">limited stage</text>
  <text x="445" y="486" text-anchor="middle" class="small">observe • challenge • hold</text>
  <rect x="650" y="425" width="190" height="84" rx="12" class="brake"/>
  <text x="745" y="458" text-anchor="middle" class="head">brake decision</text>
  <text x="745" y="486" text-anchor="middle" class="small">tested route + authority</text>
  <path d="M540 467 H645" class="connector"/>
  <line x1="875" y1="405" x2="875" y2="535" class="dash"/>
  <text x="875" y="565" text-anchor="middle" class="small">later commitment boundary</text>
  <text x="600" y="625" text-anchor="middle" class="head">A brake matters only if it can act before commitment, not merely describe it later.</text>
</svg>
