name: Framework apply ME v0.6.2 local repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'framework-me-v062-local-repair-temp-20260806'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework-me-v062-local-repair-temp-20260806
          fetch-depth: 0

      - name: Apply verified insertion-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('MECHANICAL_ETHICS_HUMAN_READER_v0_6_2.md')
          source = path.read_text(encoding='utf-8')

          def git_blob_sha(text: str) -> str:
              data = text.encode('utf-8')
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          baseline_blob = '6e06f210a5479ee6f84f5491c151a9d951a0da02'
          candidate_blob = 'cb90b3f11d7de80ce4db4400d78150e957700d65'

          if git_blob_sha(source) != baseline_blob:
              raise SystemExit('baseline blob mismatch; refusing patch')

          chapter12_anchor = (
              'Training may matter, but not if the interface still offers the same choices. '
              'A dashboard may reveal a pattern, or merely teach staff how to produce a cleaner number. '
              'An apology may be sincere while the next case enters the same queue.'
          )
          chapter12_insert = (
              'A review can check every case in its file and still miss people the route never allowed to become cases, '
              'or make unlike cases look like one pattern. Its evidence may support a wider claim, but only as far as the '
              'way the cases were chosen and measured can carry it. The organisation should make those limits visible and '
              'say whether another supported account changes the pattern. That account is not automatically right, but a '
              'material difference should not disappear inside one clean total.'
          )
          chapter15_anchor = (
              'Answerability begins when an affected outcome can travel back into the behaviour that produced it. '
              'Explanation alone is not enough. The route needs enough force to change what happens next.'
          )
          chapter15_insert = (
              'Answerability does not require a decision to remain open to the same challenge without limit. '
              'Reopening can itself become a route of harm, but repetition is not proof that the issue was answered.'
          )

          for label, anchor in [('Chapter 12', chapter12_anchor), ('Chapter 15', chapter15_anchor)]:
              if source.count(anchor) != 1:
                  raise SystemExit(f'{label} anchor count mismatch; refusing patch')

          candidate = source.replace(chapter12_anchor, chapter12_anchor + '\n\n' + chapter12_insert, 1)
          candidate = candidate.replace(chapter15_anchor, chapter15_anchor + '\n\n' + chapter15_insert, 1)

          actual = git_blob_sha(candidate)
          if actual != candidate_blob:
              raise SystemExit(f'candidate blob mismatch: {actual}')

          path.write_text(candidate, encoding='utf-8')
          print(f'candidate blob verified: {actual}')
          PY

      - name: Commit branch-only patch
        shell: bash
        run: |
          git config user.name 'Framework Integration'
          git config user.email 'noreply@openai.com'
          git add MECHANICAL_ETHICS_HUMAN_READER_v0_6_2.md
          git commit -m 'Apply bounded Chapter 12 and Chapter 15 repairs to ME v0.6.2'
          git push origin HEAD:framework-me-v062-local-repair-temp-20260806
