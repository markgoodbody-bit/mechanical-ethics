name: Mechanical Ethics reader-pressure test

on:
  push:
    branches:
      - framework/reader-pressure-route-preservation-20260918
    paths:
      - 'reader-tests/route-preservation-hard-collision-v0/**'
      - 'MECHANICAL_ETHICS.md'
      - '.github/workflows/reader-pressure-route-preservation.yml'
  pull_request:
    paths:
      - 'reader-tests/route-preservation-hard-collision-v0/**'
      - 'MECHANICAL_ETHICS.md'
      - '.github/workflows/reader-pressure-route-preservation.yml'

permissions:
  contents: read

jobs:
  source-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reader-test excerpts against source
        run: python reader-tests/route-preservation-hard-collision-v0/verify_source.py
      - name: Validate synthetic result fixture
        run: python reader-tests/route-preservation-hard-collision-v0/validate_result.py reader-tests/route-preservation-hard-collision-v0/sample-result.fixture.json
