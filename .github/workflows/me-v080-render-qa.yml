name: Mechanical Ethics v0.8.0 render QA

on:
  push:
    branches:
      - release/v0.8.0-20260923
    paths:
      - ".github/workflows/me-v080-render-qa.yml"

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.8.0-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate pages
        run: |
          python -m pip install --disable-pip-version-check pypdf==6.10.0
          mkdir -p release-qa
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          r=PdfReader("MECHANICAL_ETHICS.pdf")
          wanted={
            "figure2":"Figure 2. The correction window",
            "build":"What This Can Build",
          }
          found={}
          for idx,p in enumerate(r.pages,1):
              t=p.extract_text() or ""
              for k,s in wanted.items():
                  if k not in found and s in t:
                      found[k]=idx
          out=[f"pages={len(r.pages)}",f"figure2={found.get('figure2','')}",f"build={found.get('build','')}"]
          Path("release-qa/report.txt").write_text("\n".join(out)+"\n",encoding="utf-8")
          if not found.get("figure2") or not found.get("build"):
              raise SystemExit("required QA page not located: "+repr(found))
          PY
      - name: Render selected pages
        run: |
          cover=1
          figure2=$(awk -F= '/^figure2=/{print $2}' release-qa/report.txt)
          build=$(awk -F= '/^build=/{print $2}' release-qa/report.txt)
          pdftoppm -f "$cover" -l "$cover" -singlefile -png -r 120 MECHANICAL_ETHICS.pdf release-qa/cover
          pdftoppm -f "$figure2" -l "$figure2" -singlefile -png -r 120 MECHANICAL_ETHICS.pdf release-qa/figure2
          pdftoppm -f "$build" -l "$build" -singlefile -png -r 120 MECHANICAL_ETHICS.pdf release-qa/build
      - name: Commit QA renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-qa
          git commit -m "Render Mechanical Ethics v0.8.0 release QA pages"
          git push origin HEAD:release/v0.8.0-20260923
