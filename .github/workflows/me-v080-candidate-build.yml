name: Mechanical Ethics v0.8.0 release-candidate build

on:
  push:
    branches:
      - release/v0.8.0-20260923

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.8.0-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==6.10.0 pillow==12.3.0 cairosvg==2.8.2
      - name: Rebuild corrected Figure 2 PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="figures/figure-2-correction-window.svg",
              write_to="figures/figure-2-correction-window.png",
              output_width=1200,
              output_height=675,
          )
          PY
      - name: Build deterministic reader PDF
        run: |
          python .github/scripts/build_me_pdf.py --source MECHANICAL_ETHICS.md --output MECHANICAL_ETHICS.pdf
      - name: Record candidate identities
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths=["MECHANICAL_ETHICS.md","MECHANICAL_ETHICS.pdf","figures/figure-2-correction-window.png","figures/figure-2-correction-window.svg"]
          out=[]
          for p in paths:
              b=Path(p).read_bytes()
              out.append(f"{p}\t{len(b)}\t{hashlib.sha256(b).hexdigest()}")
          Path("RELEASE_CANDIDATE_v0.8.0_IDENTITIES.txt").write_text("\n".join(out)+"\n",encoding="utf-8")
          PY
      - name: Commit generated release carriers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MECHANICAL_ETHICS.pdf figures/figure-2-correction-window.png RELEASE_CANDIDATE_v0.8.0_IDENTITIES.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Mechanical Ethics v0.8.0 release carriers"
            git push origin HEAD:release/v0.8.0-20260923
          fi
