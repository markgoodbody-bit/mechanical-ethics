name: Mechanical Ethics v0.7.0 candidate integrity

on:
  push:
    paths:
      - ".github/workflows/me-v070-candidate.yml"
      - ".github/scripts/build_me_pdf.py"
      - "README.md"
      - "MECHANICAL_ETHICS.md"
      - "MECHANICAL_ETHICS.pdf"
      - "figures/**"
  pull_request:
    paths:
      - ".github/workflows/me-v070-candidate.yml"
      - ".github/scripts/build_me_pdf.py"
      - "README.md"
      - "MECHANICAL_ETHICS.md"
      - "MECHANICAL_ETHICS.pdf"
      - "figures/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify declared current identities and status boundary
        run: |
          printf '%s  %s\n' '4058f7ee4258ac391c59e0e71f3318b66f421c1bb012dd8b05d375d7884de1da' MECHANICAL_ETHICS.md | sha256sum -c -
          printf '%s  %s\n' '03d10fd9b6b7651bfd561c886a50a29c041bf3e3c170ba84db7007fa8d64bfcf' MECHANICAL_ETHICS.pdf | sha256sum -c -
          grep -F 'WORKING / NOT BASELINE / NOT RELEASE / NOT CANON / NOT VALIDATED' README.md
      - name: Rebuild reader PDF from Markdown
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==6.10.0 pillow==12.3.0
          python .github/scripts/build_me_pdf.py \
            --source MECHANICAL_ETHICS.md \
            --output /tmp/MECHANICAL_ETHICS.pdf
          cmp MECHANICAL_ETHICS.pdf /tmp/MECHANICAL_ETHICS.pdf
      - name: Check whitespace integrity
        run: git diff --check
