name: Mechanical Ethics v0.7.0 candidate integrity

on:
  push:
    paths:
      - ".github/workflows/me-v070-candidate.yml"
      - "tools/verify_me_v070_candidate.py"
      - "work/v0_7_0/MECHANICAL_ETHICS_HUMAN_READER_v0_7_0_NEXT_WORKING_CANDIDATE_v0_2.md"
      - "work/v0_7_0/figures/**"
  pull_request:
    paths:
      - ".github/workflows/me-v070-candidate.yml"
      - "tools/verify_me_v070_candidate.py"
      - "work/v0_7_0/MECHANICAL_ETHICS_HUMAN_READER_v0_7_0_NEXT_WORKING_CANDIDATE_v0_2.md"
      - "work/v0_7_0/figures/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_me_v070_candidate.py
