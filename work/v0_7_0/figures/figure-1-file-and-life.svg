<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The file and the life</title>
  <desc id="desc">A lived situation passes through a narrow institutional aperture. The resulting file contains true but incomplete information. Both accounts are factual but not equivalent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .title{font:600 30px Arial,sans-serif;fill:#111827}.head{font:600 22px Arial,sans-serif;fill:#111827}.text{font:18px Arial,sans-serif;fill:#1f2937}.small{font:16px Arial,sans-serif;fill:#374151}.box{fill:#f8fafc;stroke:#374151;stroke-width:2}.life{fill:#e8f1f8;stroke:#275b7a;stroke-width:2}.file{fill:#f3efe6;stroke:#7a5d27;stroke-width:2}.aperture{fill:#ffffff;stroke:#111827;stroke-width:3}.line{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">The file and the life</text>
  <rect x="70" y="105" width="360" height="420" rx="16" class="life"/>
  <text x="250" y="148" text-anchor="middle" class="head">LIFE</text>
  <text x="105" y="205" class="text">Mia is coughing</text>
  <text x="105" y="252" class="text">The damp is spreading</text>
  <text x="105" y="299" class="text">A shift starts in six hours</text>
  <text x="105" y="346" class="text">Rent and housing risk remain</text>
  <text x="105" y="393" class="text">Leah knows the smell and fear</text>
  <text x="250" y="475" text-anchor="middle" class="small">Lived conditions continue changing</text>
  <rect x="500" y="185" width="200" height="260" rx="12" class="aperture"/>
  <text x="600" y="225" text-anchor="middle" class="head">PORTAL</text>
  <text x="600" y="272" text-anchor="middle" class="small">Accepted category</text>
  <text x="600" y="307" text-anchor="middle" class="small">Upload limit</text>
  <text x="600" y="342" text-anchor="middle" class="small">Required fields</text>
  <text x="600" y="377" text-anchor="middle" class="small">Queue rule</text>
  <text x="600" y="417" text-anchor="middle" class="small">A narrow aperture</text>
  <rect x="770" y="105" width="360" height="420" rx="16" class="file"/>
  <text x="950" y="148" text-anchor="middle" class="head">FILE</text>
  <text x="805" y="205" class="text">Category: damp and mould</text>
  <text x="805" y="252" class="text">Timestamp: 01:17</text>
  <text x="805" y="299" class="text">Reference number</text>
  <text x="805" y="346" class="text">Photograph received</text>
  <text x="805" y="393" class="text">Status: entered queue</text>
  <text x="950" y="475" text-anchor="middle" class="small">Standardised and authoritative</text>
  <path d="M430 315 H495" class="line"/>
  <path d="M705 315 H765" class="line"/>
  <text x="600" y="580" text-anchor="middle" class="head">Both accounts can contain facts. They are not equivalent.</text>
  <text x="600" y="620" text-anchor="middle" class="small">The file does not stop the life from changing while the case waits.</text>
</svg>
