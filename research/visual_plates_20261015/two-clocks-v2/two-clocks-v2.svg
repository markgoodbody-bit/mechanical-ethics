<svg xmlns="http://www.w3.org/2000/svg" width="126mm" height="54.6mm" viewBox="0 0 900 390" role="img" aria-labelledby="clock-v2-title clock-v2-desc">
  <title id="clock-v2-title">One payment, two losses</title>
  <desc id="clock-v2-desc">Two parallel tracks share one starting event. A filled dot marks the same usable payment on each track. On the payment track it precedes a specified loss-hardening tick; on the housing track a home-loss tick comes first. The synthetic order is not measured time. Acknowledgement is omitted because the comparison concerns actual usable funds, not receipt of a request.</desc>
  <rect width="900" height="390" fill="#ffffff"/>
  <g fill="none" stroke="#27312F" stroke-width="1.4" stroke-linecap="round">
    <line id="origin" x1="65" y1="125" x2="65" y2="295"/>
    <line id="payment-axis" x1="65" y1="150" x2="845" y2="150"/>
    <line id="housing-axis" x1="65" y1="280" x2="845" y2="280"/>
    <line id="same-event-guide" x1="540" y1="150" x2="540" y2="280" stroke-width="0.8"/>
    <line id="payment-hardening" x1="780" y1="139" x2="780" y2="161" stroke-width="2"/>
    <line id="housing-hardening" x1="375" y1="269" x2="375" y2="291" stroke-width="2"/>
  </g>
  <g fill="#27584F" stroke="#27312F" stroke-width="1.4">
    <circle id="payment-effect" cx="540" cy="150" r="6"/>
    <circle id="same-payment-effect" cx="540" cy="280" r="6"/>
  </g>
  <g fill="#27312F" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400">
    <text x="85" y="80">Payment</text>
    <text x="85" y="230">Housing</text>
    <text x="540" y="110" text-anchor="middle">Funds usable</text>
    <text x="780" y="110" text-anchor="middle">Loss hardens</text>
    <text x="375" y="330" text-anchor="middle">Home lost</text>
    <text x="65" y="365">Same start</text>
  </g>
</svg>
