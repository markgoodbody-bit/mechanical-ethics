<svg xmlns="http://www.w3.org/2000/svg" width="126mm" height="106.400mm" viewBox="0 0 900 760" role="img" aria-labelledby="01-two-clocks-title 01-two-clocks-desc">
<title id="01-two-clocks-title">Two clocks, one start</title>
<desc id="01-two-clocks-desc">Two aligned paths share one declared start. Funds become usable before one specified loss hardens, but after an earlier housing loss. Acknowledgement is a distinct earlier event. An unsupported clock remains UNKNOWN.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#27312F" stroke-width="1.5"/></marker></defs>
<rect width="900" height="760" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#27312F" stroke-linecap="round" stroke-linejoin="round">
<text x="55" y="72" font-size="44" text-anchor="start" font-weight="700"><tspan x="55" dy="0">Two clocks, one start</tspan></text><text x="55" y="120" font-size="26" text-anchor="start" font-weight="400"><tspan x="55" dy="0">Compare the effect with the particular loss.</tspan></text><line x1="55" y1="148" x2="845" y2="148" stroke="#27312F" stroke-width="2.5" /><text x="55" y="193" font-size="26" text-anchor="start" font-weight="700"><tspan x="55" dy="0">Payment path</tspan></text><line x1="35" y1="275" x2="820" y2="275" stroke="#27312F" stroke-width="2.5" id="payment-axis"/><line x1="35" y1="245" x2="35" y2="472" stroke="#27312F" stroke-width="2.5" id="shared-origin"/><circle id="acknowledgement" cx="260" cy="275" r="7" fill="#ffffff" stroke="#27312F" stroke-width="2.5"/><circle id="payment-effect" cx="535" cy="275" r="9" fill="#27312F" stroke="#27312F" stroke-width="2.5"/><line x1="790" y1="257" x2="790" y2="293" stroke="#27312F" stroke-width="4" id="payment-hardening"/><text x="62" y="265" font-size="26" text-anchor="middle" font-weight="400"><tspan x="62" dy="0">t0</tspan></text><text x="660" y="320" font-size="26" text-anchor="middle" font-weight="400"><tspan x="660" dy="0">Effect strictly before loss</tspan></text><text x="260" y="234" font-size="26" text-anchor="middle" font-weight="400"><tspan x="260" dy="0">Acknowledged</tspan></text><text x="535" y="222" font-size="26" text-anchor="middle" font-weight="700"><tspan x="535" dy="0">Funds</tspan><tspan x="535" dy="33.28">usable</tspan></text><text x="790" y="222" font-size="26" text-anchor="middle" font-weight="400"><tspan x="790" dy="0">Specified loss</tspan><tspan x="790" dy="33.28">hardens</tspan></text><text x="55" y="382" font-size="26" text-anchor="start" font-weight="700"><tspan x="55" dy="0">Coupled housing path</tspan></text><line x1="35" y1="445" x2="820" y2="445" stroke="#27312F" stroke-width="2.5" id="housing-axis"/><line x1="405" y1="427" x2="405" y2="463" stroke="#27312F" stroke-width="4" id="housing-hardening"/><circle id="same-payment-effect" cx="535" cy="445" r="9" fill="#27312F" stroke="#27312F" stroke-width="2.5"/><text x="405" y="411" font-size="26" text-anchor="middle" font-weight="400"><tspan x="405" dy="0">Housing loss</tspan></text><text x="535" y="492" font-size="26" text-anchor="middle" font-weight="400"><tspan x="535" dy="0">Same funds usable;</tspan><tspan x="535" dy="33.28">housing already lost</tspan></text><text x="55" y="520" font-size="26" text-anchor="start" font-weight="400"><tspan x="55" dy="0">t0 = declared start</tspan></text><rect x="55" y="558" width="790" height="144" rx="3" fill="#E8EFEB" stroke="#27584F" stroke-width="2.5"/><text x="80" y="598" font-size="28" text-anchor="start" font-weight="700"><tspan x="80" dy="0">UNKNOWN</tspan></text><text x="80" y="640" font-size="26" text-anchor="start" font-weight="400"><tspan x="80" dy="0">Without supported starts or bounds, no window is established.</tspan><tspan x="80" dy="33.28">That alone orders neither a stop nor continuation.</tspan></text>
</g></svg>
