<svg xmlns="http://www.w3.org/2000/svg" width="126mm" height="106.400mm" viewBox="0 0 900 760" role="img" aria-labelledby="02-who-draws-the-map-title 02-who-draws-the-map-desc">
<title id="02-who-draws-the-map-title">Who draws the map?</title>
<desc id="02-who-draws-the-map-desc">An institution selects an account comparing evening opening hours with the current timetable. Outside its selected account, a visitor faces a missed last bus. A labelled evidence and challenge route leads to an authorised reviewer; it does not predetermine the response.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#27312F" stroke-width="1.5"/></marker></defs>
<rect width="900" height="760" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#27312F" stroke-linecap="round" stroke-linejoin="round">
<text x="55" y="72" font-size="44" text-anchor="start" font-weight="700"><tspan x="55" dy="0">Who draws the map?</tspan></text><text x="55" y="120" font-size="26" text-anchor="start" font-weight="400"><tspan x="55" dy="0">An account selects. The consequences extend beyond it.</tspan></text><line x1="55" y1="148" x2="845" y2="148" stroke="#27312F" stroke-width="2.5" /><text x="75" y="198" font-size="28" text-anchor="start" font-weight="700"><tspan x="75" dy="0">Institution / assessor</tspan></text><line x1="285" y1="214" x2="285" y2="250" stroke="#27312F" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 75 268 H 480 L 525 313 V 460 H 75 Z M 480 268 V 313 H 525" fill="#E8EFEB" stroke="#27312F" stroke-width="2.5"/><text x="100" y="310" font-size="26" text-anchor="start" font-weight="700"><tspan x="100" dy="0">Selected account</tspan></text><text x="100" y="356" font-size="26" text-anchor="start" font-weight="400"><tspan x="100" dy="0">Evening opening hours</tspan><tspan x="100" dy="33.28">versus current timetable</tspan></text><line x1="100" y1="403" x2="490" y2="403" stroke="#27312F" stroke-width="2.5" /><text x="100" y="440" font-size="26" text-anchor="start" font-weight="400"><tspan x="100" dy="0">Whose scope? Which period?</tspan></text><line x1="535" y1="338" x2="625" y2="338" stroke="#27312F" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="645" y="268" width="195" height="176" rx="3" fill="none" stroke="#27312F" stroke-width="2.5"/><text x="742" y="314" font-size="28" text-anchor="middle" font-weight="700"><tspan x="742" dy="0">Authorised</tspan><tspan x="742" dy="35.84">reviewer</tspan></text><text x="742" y="392" font-size="26" text-anchor="middle" font-weight="400"><tspan x="742" dy="0">Considers</tspan><tspan x="742" dy="33.28">the evidence</tspan></text><g transform="translate(135 591) scale(1)"><circle cx="0" cy="-65" r="13" fill="#ffffff" stroke="#27312F" stroke-width="2.5"/><line x1="0" y1="-52" x2="0" y2="-10" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-10" x2="-17" y2="20" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-10" x2="17" y2="20" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-40" x2="-25" y2="-23" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-40" x2="25" y2="-23" stroke="#27312F" stroke-width="2.5" /></g><text x="75" y="654" font-size="26" text-anchor="start" font-weight="400"><tspan x="75" dy="0">Affected</tspan><tspan x="75" dy="33.28">visitor</tspan></text><rect x="290" y="523" width="180" height="82" rx="3" fill="none" stroke="#27312F" stroke-width="2.5"/><line x1="300" y1="545" x2="460" y2="545" stroke="#27312F" stroke-width="2.5" /><line x1="330" y1="523" x2="330" y2="545" stroke="#27312F" stroke-width="2.5" /><line x1="380" y1="523" x2="380" y2="545" stroke="#27312F" stroke-width="2.5" /><circle cx="325" cy="609" r="12" fill="#27312F" stroke="#27312F" stroke-width="2.5"/><circle cx="435" cy="609" r="12" fill="#27312F" stroke="#27312F" stroke-width="2.5"/><text x="275" y="654" font-size="26" text-anchor="start" font-weight="400"><tspan x="275" dy="0">Last bus</tspan><tspan x="275" dy="33.28">already left</tspan></text><path d="M 490 558 H 742 V 455" fill="none" stroke="#27312F" stroke-width="2.5" marker-end="url(#arrow)"/><text x="505" y="517" font-size="26" text-anchor="start" font-weight="400"><tspan x="505" dy="0">Evidence /</tspan><tspan x="505" dy="33.28">challenge route</tspan></text><text x="55" y="728" font-size="28" text-anchor="start" font-weight="700"><tspan x="55" dy="0">The account is not the whole situation.</tspan></text>
</g></svg>
