<svg xmlns="http://www.w3.org/2000/svg" width="126mm" height="106.400mm" viewBox="0 0 900 760" role="img" aria-labelledby="03-growing-room-title 03-growing-room-desc">
<title id="03-growing-room-title">Growing room</title>
<desc id="03-growing-room-desc">Three illustrative panels revisit a child, a glass and a planted pot by a window. First the child notices conditions; then an adult helps the child practise with a tray; finally the child tries another plant while help and tools remain available. Learning is possible, not guaranteed, and continuing upkeep has people behind it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#27312F" stroke-width="1.5"/></marker></defs>
<rect width="900" height="760" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#27312F" stroke-linecap="round" stroke-linejoin="round">
