-10" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-10" x2="-17" y2="20" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-10" x2="17" y2="20" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-40" x2="-25" y2="-23" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-40" x2="25" y2="-23" stroke="#27312F" stroke-width="2.5" /></g><line x1="635" y1="476" x2="888" y2="476" stroke="#27312F" stroke-width="1.5" /><path d="M 747 451 H 785 L 780 474 H 753 Z" fill="none" stroke="#27312F" stroke-width="2.5"/><line x1="767" y1="451" x2="767" y2="437" stroke="#27584F" stroke-width="2.5" /><text x="635" y="535" font-size="26" text-anchor="start" font-weight="400"><tspan x="635" dy="0">Try another plant.</tspan><tspan x="635" dy="33.28">Choose a direction.</tspan></text><line x1="55" y1="604" x2="845" y2="604" stroke="#27312F" stroke-width="2.5" /><text x="55" y="648" font-size="30" text-anchor="start" font-weight="700"><tspan x="55" dy="0">Someone keeps the room usable.</tspan></text><text x="55" y="691" font-size="26" text-anchor="start" font-weight="400"><tspan x="55" dy="0">Practice may form capability. It can also fail.</tspan><tspan x="55" dy="33.28">Support leaves room to refuse, change course or outgrow it.</tspan></text>
</g></svg>
