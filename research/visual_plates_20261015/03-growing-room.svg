="400"><tspan x="55" dy="0">Water, light,</tspan><tspan x="55" dy="33.28">time.</tspan></text><text x="345" y="204" font-size="30" text-anchor="start" font-weight="700"><tspan x="345" dy="0">2 · Practise</tspan></text><rect x="402" y="241" width="150" height="130" rx="3" fill="none" stroke="#27312F" stroke-width="2.5"/><line x1="477" y1="241" x2="477" y2="371" stroke="#27312F" stroke-width="2.5" /><line x1="402" y1="306" x2="552" y2="306" stroke="#27312F" stroke-width="2.5" /><line x1="393" y1="429" x2="562" y2="429" stroke="#27312F" stroke-width="2.5" /><line x1="413" y1="429" x2="413" y2="476" stroke="#27312F" stroke-width="2.5" /><line x1="545" y1="429" x2="545" y2="476" stroke="#27312F" stroke-width="2.5" /><path d="M 421 383 L 426 421 H 450 L 455 383 Z" fill="none" stroke="#27312F" stroke-width="2.5"/><line x1="426" y1="402" x2="450" y2="402" stroke="#27584F" stroke-width="2.5" /><path d="M 490 400 H 536 L 529 425 H 497 Z" fill="#E8EFEB" stroke="#27312F" stroke-width="2.5"/><line x1="513" y1="400" x2="513" y2="367" stroke="#27584F" stroke-width="2.5" /><path d="M 513 381 Q 488 356 492 376 Q 500 388 513 381 M 513 373 Q 539 347 535 368 Q 527 382 513 373" fill="#E8EFEB" stroke="#27312F" stroke-width="2.5"/><rect x="485" y="429" width="57" height="9" rx="3" fill="none" stroke="#27312F" stroke-width="2.5"/><g transform="translate(368 460) scale(0.8)"><circle cx="0" cy="-65" r="13" fill="#ffffff" stroke="#27312F" stroke-width="2.5"/><line x1="0" y1="-52" x2="0" y2="-10" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-10" x2="-17" y2="20" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-10" x2="17" y2="20" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-40" x2="-25" y2="-23" stroke="#27312F" stroke-width="2.5" /><line x1="0" y1="-40" x2="25" y2="-23" stroke="#27312F" stroke-width="2.5" /></g><line x1="345" y1="476" x2="598" y2="476" stroke="#27312F" stroke-width="1.5" /><g transform="translate(584 455) scale(1.05)"><circle cx="0" cy="-65" r="13"